note: >-
  C. Hoare & Co. follows the OBIE Read/Write error model rather than RFC 9457
  problem+json. Every 4xx/5xx response returns an OBErrorResponse1 envelope whose
  Errors[].ErrorCode uses the UK.OBIE.* namespace. HTTP-status problems below are
  derived from the OpenAPI responses; the granular ErrorCode list is the published
  OBIE v3.1 error-code registry the bank conforms to.
problems:
  - status: 400
    title: Bad Request
    description: The request is malformed, fails schema validation, or violates a business rule.
    schema: OBErrorResponse1
  - status: 401
    title: Unauthorized
    description: Missing, invalid, or expired access token, or failed FAPI/mTLS client authentication.
  - status: 403
    title: Forbidden
    description: The token is valid but lacks the consent, scope, or permission for the resource.
  - status: 404
    title: Not Found
    description: The requested resource (account, consent, or payment) does not exist or is not visible to this TPP.
  - status: 405
    title: Method Not Allowed
    description: The HTTP method is not supported for this resource.
  - status: 406
    title: Not Acceptable
    description: The Accept header requests a representation the API cannot produce.
  - status: 415
    title: Unsupported Media Type
    description: The request Content-Type is not application/json (or the expected media type).
  - status: 429
    title: Too Many Requests
    description: The TPP has exceeded the permitted request/polling rate for the resource.
  - status: 500
    title: Internal Server Error
    description: An unexpected error occurred at the ASPSP; retry per OBIE operational guidance.
  - status: 201
    title: Created (payment/consent)
    description: Successful creation of a consent or payment order resource (not an error; listed for completeness).
