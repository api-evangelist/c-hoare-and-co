aid: c-hoare-and-co
url: https://raw.githubusercontent.com/api-evangelist/c-hoare-and-co/refs/heads/main/apis.yml
name: C. Hoare & Co.
kind: company
description: C. Hoare & Co. (Hoares Bank) is the United Kingdom's oldest privately-owned bank, founded
  in 1672 by Sir Richard Hoare and owned continuously by the Hoare family for twelve generations, operating
  a bespoke private banking, lending, and wealth business from Fleet Street in London and an office in
  Cambridge. It is an FCA-authorised ASPSP (Account Servicing Payment Service Provider) and a regulated
  participant in UK Open Banking under PSD2. As a private bank it is not one of the CMA9 mandated institutions,
  so it does not publish the unauthenticated Open Data (ATM / branch / product) reference APIs; instead
  it exposes the OBIE Read/Write standard through a MuleSoft Anypoint developer portal at developer.hoaresbank.co.uk,
  publishing Account and Transaction Information (AIS), Payment Initiation (PIS), and Dynamic Client Registration
  conformant to the Open Banking Implementation Entity (OBIE) v3.1 standard. Production access is FAPI-secured
  with OAuth2/OIDC, PSD2 strong customer authentication, and mutual-TLS client authentication using OBIE/eIDAS
  certificates after third-party provider onboarding.
